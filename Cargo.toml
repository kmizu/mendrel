[workspace]
members = [
    "crates/mendrel-diagnostics",
    "crates/mendrel-format",
    "crates/mendrel-parser",
    "crates/mendrel-source",
    "crates/mendrel-syntax",
    "crates/mendrel-cli",
    "crates/mendrelc",
    "xtask",
]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96"
version = "0.0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
